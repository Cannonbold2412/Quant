# 15-minute bars.

name: 15min
version: "1.0.0"
description: One bar per fifteen minutes.

bar_seconds: 900
fill_model: next_bar_open
cost_stress_multipliers: [1.0, 2.0]

walk_forward:
  train_years: [1, 2, 3]
  test_years: 1
  # 252 sessions x 25 bars.
  min_train_bars: 6300
  min_test_bars: 6300

min_trades: 100
overnight_positions: false
fidelity_warning: null

periods_per_year_assertions:
  nse_equity: 6300
