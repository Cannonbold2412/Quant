# Global macro CFD costs (TRD §6.3).
#
# Spread-dominated: there is no STT/stamp/exchange-fee stack here, just the
# broker's spread plus a commission allowance. Rates below assume an ECN-style
# retail account on liquid symbols (EURUSD, XAUUSD, USA500): ~0.8 bps spread
# plus ~0.4 bps commission/slippage per side, ~2.4 bps round trip.
#
# PROVENANCE: typical published retail ECN pricing, not a real contract note.
# Exotics and energy widen 5-20x — a single cost model for all 38 instruments
# is only defensible because the loop's default instrument is a deep-liquidity
# index; re-derive per symbol before scoring anything thin.

