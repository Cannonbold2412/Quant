[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqrl"
version = "0.1.0"
description = "AQRL — Autonomous Quantitative Research Laboratory"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    # The research loop (Stage 0, aqrl/research/) — the scoring harness still
    # runs on NumPy/pandas/SciPy.
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    # Stage 3: JIT for the one profiled, genuinely path-dependent hot loop
    # (stationary-bootstrap resampling) — TRD §9.2, applied on evidence, not
    # speculatively (see aqrl/eval/stats/monte_carlo.py).
    "numba>=0.59",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Stage 5: the real Claude session wrapper (aqrl/agents/session.py). Imported
# lazily, so nothing in the test suite needs this installed — StubSession and
# ReplaySession stand in for every test, including the full offline loop.
agents = ["anthropic>=0.40"]
# Stage 7: the real embedding client (aqrl/agents/embeddings.py). Imported
# lazily, same reasoning as `agents` above — StubEmbedder stands in for
# every test, including the full offline loop.
embeddings = ["voyageai>=0.3"]

[project.scripts]
aqrl = "aqrl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aqrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The research loop executes the committed strategy source by design (TRD §2.1).
# It is
# not a security sandbox and does not claim to be — real agent isolation is
# aqrl/agents/sandbox.py's job (Stage 5). Flagging it here every run adds
# noise, not safety.
"aqrl/research/evaluate.py" = ["S102"]
# Stage 5's static-check pipeline: executing the rendered module is the whole
# job of this file, inside the process-isolated subprocess `sandbox.py`
# spawns — not a place code review needs a warning about `exec`.
"aqrl/agents/_sandbox_worker.py" = ["S102"]
# The P0 look-ahead scanner keeps its branches explicit rather than collapsing
# them into a precedence-dependent boolean chain. Readability wins in the one
# place where a misread condition silently stops catching leaks.
"aqrl/research/backtest.py" = ["SIM114"]
# The research loop's tests, left as written.
"tests/research/*" = ["RUF059", "SIM117"]
